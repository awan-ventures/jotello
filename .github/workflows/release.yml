name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./scripts/test.sh
      - name: Build universal app
        run: ./scripts/build.sh
      # Ad hoc signing seals the bundle so macOS offers "Open Anyway" instead of calling it damaged.
      # Replace with Developer ID signing and notarization once the secrets exist.
      - name: Sign ad hoc and zip
        run: |
          codesign --force --deep --options runtime --sign - build/Build/Products/Release/Jotello.app
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/Jotello.app "build/Jotello-${GITHUB_REF_NAME}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/Jotello-${GITHUB_REF_NAME}.zip" --title "Jotello ${GITHUB_REF_NAME}" --notes-file .github/release-notes.md
